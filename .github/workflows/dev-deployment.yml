name: Deploy to Dev Environment
  echo "Test JEJ"

on:
  pull_request:
    branches: [ OrgDestination ]
    paths:
      - 'force-app/**'
      - 'manifest/**'

env:
  SF_USE_GENERIC_UNIX_KEYCHAIN: true
  SF_DOMAIN_RETRY: 300
  SF_DISABLE_APP_HUB: true
  SF_LOG_LEVEL: DEBUG

jobs:
  validate-deployment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli
          sf --version

      - name: Install SFDX Git Delta
        run: echo y | sf plugins install sfdx-git-delta

      - name: Create JWT Key File
        run: |
          echo "${{ secrets.SF_JWT_KEY }}" | tr -d '\r' > jwt-key.txt
          chmod 600 jwt-key.txt

      - name: Authenticate to Salesforce
        run: |
          sf org login jwt \
            --client-id ${{ secrets.SF_CLIENT_ID }} \
            --jwt-key-file jwt-key.txt \
            --username ${{ secrets.SF_USERNAME }} \
            --instance-url ${{ secrets.SF_INSTANCE_URL }} \
            --alias target-org \
            --set-default

      - name: Verify Authentication
        run: sf org display --target-org target-org

      - name: Generate Delta Package
        run: |
          BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          echo "Fetching base branch $BASE_BRANCH..."
          git fetch origin $BASE_BRANCH

          echo "Generating delta package between origin/$BASE_BRANCH and commit $HEAD_SHA"
          mkdir -p delta

          sf sgd:source:delta \
            --to $HEAD_SHA \
            --from origin/$BASE_BRANCH \
            --output-dir delta \
            --generate-delta

          echo "Generated package.xml:"
          if [ -f "delta/package.xml" ]; then
            cat delta/package.xml
          else
            echo "No package.xml generated"
          fi

          echo "Delta folder structure:"
          find delta -type f || echo "No files in delta folder"

          if [ ! -f "delta/package.xml" ] || [ ! -s "delta/package.xml" ]; then
            echo "No metadata changes detected — skipping deployment."
            echo "SKIP_DEPLOYMENT=true" >> $GITHUB_ENV
          else
            echo "Metadata changes detected — proceeding with deployment."
            echo "SKIP_DEPLOYMENT=false" >> $GITHUB_ENV
          fi

      - name: Upload Delta Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delta-package
          path: delta

      - name: Validate Deployment (Check Only)
        id: validate_step
        if: env.SKIP_DEPLOYMENT == 'false'
        run: |
          echo "Starting validation deployment..."
          sf project deploy validate \
            --manifest delta/package.xml \
            --target-org target-org \
            --test-level RunLocalTests \
            --wait 30 \
            --json > result.json

          DEPLOY_ID=$(jq -r '.result.id' result.json)
          echo "validation_id=$DEPLOY_ID" >> $GITHUB_OUTPUT
          echo "Validation ID: $DEPLOY_ID"

      - name: Quick Deploy
        if: success() && steps.validate_step.outputs.validation_id
        run: |
          echo "Starting quick deployment using ID: ${{ steps.validate_step.outputs.validation_id }}"
          sf project deploy quick \
            --deploy-id ${{ steps.validate_step.outputs.validation_id }} \
            --target-org target-org \
            --wait 30 \
            --verbose